openapi: 3.0.3
info:
  title: Payroll Generation Processor API
  version: 1.0.0
  description: Contrato para consulta do processamento assíncrono de geração de holerite.
paths:
  /api/v1/payroll-documents:
    get:
      summary: Consulta o resultado da geração do holerite por empresa, colaborador e período
      tags: [Payroll Documents]
      parameters:
        - in: query
          name: companyId
          required: true
          schema:
            type: string
        - in: query
          name: employeeId
          required: true
          schema:
            type: string
        - in: query
          name: month
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - in: query
          name: year
          required: true
          schema:
            type: integer
            minimum: 1900
      responses:
        '200':
          description: Documento encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollDocumentResponse'
        '404':
          description: Holerite não encontrado para o período informado
components:
  schemas:
    PayrollDocumentResponse:
      type: object
      required: [companyId, employeeId, requesterId, month, year, fileName, fileUrl, grossAmount, discountAmount, netAmount, status, processedAt]
      properties:
        companyId:
          type: string
        employeeId:
          type: string
        requesterId:
          type: string
        month:
          type: integer
        year:
          type: integer
        fileName:
          type: string
        fileUrl:
          type: string
          format: uri
        grossAmount:
          type: number
        discountAmount:
          type: number
        netAmount:
          type: number
        status:
          type: string
          enum: [RECEIVED, PROCESSING, COMPLETED, FAILED]
        processedAt:
          type: string
          format: date-time
